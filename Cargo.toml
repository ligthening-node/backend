[workspace]
resolver = "2"
members = ["crates/invoice-core", "crates/invoice-cli", "crates/invoice-wasm", "crates/node-core", "crates/api-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# One rust-lightning release set: ldk-node 0.7 builds on lightning 0.2, lightning-invoice 0.34, bitcoin 0.32.
[workspace.dependencies]
bitcoin = { version = "0.32.7", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
lightning = "0.2.0"
lightning-invoice = "0.34.0"
ldk-node = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
invoice-core = { path = "crates/invoice-core" }
node-core = { path = "crates/node-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = "0.5"
subtle = "2"
futures-util = { version = "0.3", default-features = false }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
wasm-bindgen = "0.2.129"

[workspace.lints.clippy]
# Project style requires explicit `return` statements.
needless_return = "allow"

# Keeps the browser .wasm small; the decoder is fast enough that size matters more than speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Local copy of ldk-node 0.7.0 with one change: channels accept a payment of up to 100% of their size
# (upstream default is 10%). See vendor/ldk-node/src/config.rs.
[patch.crates-io]
ldk-node = { path = "vendor/ldk-node" }
